{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Agendamento - Leila Hair</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="main-wrapper" style="width: 100%; display: flex; justify-content: center; padding: 40px 20px;">
        <div class="form-card" style="background: white; width: 100%; max-width: 800px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden;">
            
            <div class="form-header" style="background: #2c1810; padding: 30px; color: white; text-align: center;">
                <h2 class="fw-bold mb-1">Agende seu Horário</h2>
                <p class="small mb-0 opacity-75">Salão da Leila</p>
            </div>

            <div class="p-4 p-md-5">
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show border-start border-4 {% if message.tags == 'warning' %}border-warning{% else %}border-success{% endif %} shadow-sm" role="alert">
                            <i class="fas {% if message.tags == 'warning' %}fa-exclamation-triangle text-warning{% else %}fa-check-circle text-success{% endif %} me-2"></i> 
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" id="agendamentoForm">
                    {% csrf_token %}

                    {% if aviso_duplicado %}
                        <input type="hidden" name="confirmar_duplicado" value="true">
                    {% endif %}

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small text-uppercase">Nome Completo</label>
                        <input type="text" name="cliente_nome" class="form-control form-control-lg" 
                               placeholder="Digite seu nome" value="{{ dados.cliente_nome|default:'' }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small text-uppercase">Telefone</label>
                        <input type="text" name="telefone" class="form-control form-control-lg" 
                               placeholder="(00) 00000-0000" value="{{ dados.telefone|default:'' }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small text-uppercase">Data e Hora</label>
                        <input type="{% if dados.data_hora %}datetime-local{% else %}text{% endif %}" 
                               name="data_hora" 
                               class="form-control form-control-lg" 
                               placeholder="dia/mês/ano --:--" 
                               value="{{ dados.data_hora|default:'' }}"
                               onfocus="(this.type='datetime-local')" 
                               onblur="if(!this.value)this.type='text'"
                               required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small text-uppercase">Escolha a Profissional</label>
                        <select name="profissional" class="form-select form-select-lg" required>
                            <option value="" disabled {% if not dados.profissional %}selected{% endif %}>Selecione...</option>
                            <option value="victoria" {% if dados.profissional == 'victoria' %}selected{% endif %}>Victoria</option>
                            <option value="adriana" {% if dados.profissional == 'adriana' %}selected{% endif %}>Adriana</option>
                            <option value="josiane" {% if dados.profissional == 'josiane' %}selected{% endif %}>Josiane</option>
                            <option value="rosangela" {% if dados.profissional == 'rosangela' %}selected{% endif %}>Rosangela</option>
                            <option value="camila" {% if dados.profissional == 'camila' %}selected{% endif %}>Camila</option>
                        </select>
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-bold text-secondary small text-uppercase mb-3 d-block">Selecione os Serviços</label>
                        <div class="row g-3">
                            {% for servico in servicos %}
                            <div class="col-md-6">
                                <div class="service-option h-100 p-3 border rounded">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="servicos" value="{{ servico.id }}" id="s{{ servico.id }}"
                                        {% if servico.id|stringformat:"i" in servicos_selecionados %}checked{% endif %}>
                                        <label class="form-check-label ms-2" for="s{{ servico.id }}">
                                            <span class="d-block fw-bold">{{ servico.nome }}</span>
                                            <span class="text-muted small">R$ {{ servico.preco }}</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <button type="submit" class="btn btn-lg w-100 text-white fw-bold shadow-sm mb-3" 
                            style="background-color: {% if aviso_duplicado %}#dc3545{% else %}#5d3712{% endif %}; border: none; height: 60px;">
                        {% if aviso_duplicado %} 
                            <i class="fas fa-check-circle me-2"></i> CONFIRMAR MESMO ASSIM 
                        {% else %} 
                            Confirmar Agendamento <i class="fas fa-arrow-right ms-2"></i>
                        {% endif %}
                    </button>

                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" onclick="window.location.href=window.location.pathname" class="btn btn-outline-secondary w-100 border-dashed">
                                <i class="fas fa-eraser me-2"></i> Limpar
                            </button>
                        </div>
                        <div class="col-6">
                            <a href="{% url 'historico_agendamentos' %}" class="btn btn-dark w-100 shadow-sm" style="background-color: #3d2b1f; border: none;">
                                <i class="fas fa-calendar-alt me-2"></i> Histórico
                            </a>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
